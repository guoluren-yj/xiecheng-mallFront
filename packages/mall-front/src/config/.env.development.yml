# 环境变量配置

BASE_PATH: ${BASE_PATH:/}
ENV_BASE_PATH: ${BASE_PATH}
APP_NAME: ${APP_NAME:mall-front}
API_HOST: 'https://dev.isrm.going-link.com'
CLIENT_ID: ${CLIENT_ID:localhost}
SRM_HOST: "https://dev.isrm.going-link.com/app"
GENERATE_SOURCEMAP: false
SKIP_TS_CHECK_IN_START: false # yarn start 时, 是否跳过 ts 语法检查
SKIP_ESLINT_CHECK_IN_START: true # yarn start 时, 是否跳过 eslint 语法检查
SKIP_NO_CHANGE_MODULE: false # 是否跳过未变更的子模块编译
NO_PROXY: true # mock 开关
YQCLOUD_LOGIN_URL: https://going-link.stag.yqcloud.com/#/itsm/portal/service_list?solutionId=297028499535822848&tenantId=296800598219681792 #登陆燕千云地址
YQCLOUD_PASS_URL: https://going-link.stag.yqcloud.com/oauth/public/yqc/no/pass/url/goingLinkSubmit # 燕千云在线提单地址
YQCLOUD_BOTPRESS_URL: https://botpress.stag.yqcloud.com/s/297087927781949440
HELPROBOT_WECHAT_ICON: BUILD_HELPROBOT_WECHAT_ICON # 标识在线客服企业微信图标是否显示
PUBLIC_URL: "/"
FORCE_PROD_DLL: true # 是否强制使用react生产文件
MALL_AUTO_API_HOST: false # 是否自动处理网关域名
WEBSOCKET_HOST: ${BUILD_WEBSOCKET_HOST:https://dev.isrm.going-link.com/hpfm/sock-js}
OBS_PUBLIC_URL: 'https://static.going-link.com'
AUTO_LOGOUT_METHOD: 'client' # 自动登出方式有server / client

# 数据漫游者埋点接入的pid
DATA_RANGERS_APP_ID: 'mall-pc'

# 控制那些变量输入到浏览器环境， 浏览器代码可以通过 process.env.xxx 读取环境变量
CLIENT_ENV_LIST:
  - API_HOST
  - CLIENT_ID
  - SRM_HOST
  - HELPROBOT_WECHAT_ICON
  - YQCLOUD_BOTPRESS_URL
  - YQCLOUD_PASS_URL
  - YQCLOUD_LOGIN_URL
  - MALL_AUTO_API_HOST
  - DATA_RANGERS_APP_ID
  - WEBSOCKET_HOST
  - OBS_PUBLIC_URL
  - AUTO_LOGOUT_METHOD

# PACKAGE_PUBLIC_URL:
  # - http://localhost:8080/dist/srm-front-smdm
