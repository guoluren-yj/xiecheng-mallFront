# 环境变量配置

BASE_PATH: "/"
ENV_BASE_PATH: ${BASE_PATH}
APP_NAME: "mall-front"
API_HOST: BUILD_API_HOST
CLIENT_ID: BUILD_MALL_CLIENT_ID
SRM_HOST: BUILD_SRM_HOST
GENERATE_SOURCEMAP: false
SKIP_TS_CHECK_IN_START: false # yarn start 时, 是否跳过 ts 语法检查
SKIP_ESLINT_CHECK_IN_START: true # yarn start 时, 是否跳过 eslint 语法检查
SKIP_NO_CHANGE_MODULE: false # 是否跳过未变更的子模块编译
NO_PROXY: true # mock 开关
PUB_PUBLIC_URL: BUILD_MALL_PUBLIC_URL
PUBLIC_URL: BUILD_MALL_PUBLIC_URL
MALLENV_NAME: MALL_ENV
FORCE_PROD_DLL: true # 是否强制使用react生产文件
YQCLOUD_LOGIN_URL: BUILD_YQCLOUD_LOGIN_URL #登陆燕千云地址
YQCLOUD_PASS_URL: BUILD_YQCLOUD_PASS_URL # 燕千云在线提单地址
YQCLOUD_BOTPRESS_URL: BUILD_YQCLOUD_BOTPRESS_URL
HELPROBOT_WECHAT_ICON: BUILD_HELPROBOT_WECHAT_ICON # 标识在线客服企业微信图标是否显示
MALL_AUTO_API_HOST: SYSTEM_AUTO_API_HOST # 是否自动处理网关域名
OBS_PUBLIC_URL: 'https://static.going-link.com'

# 数据漫游者埋点接入的pid
DATA_RANGERS_APP_ID: 'mall-pc'
WEBSOCKET_HOST: BUILD_WEBSOCKET_HOST
AUTO_LOGOUT_METHOD: BUILD_AUTO_LOGOUT_METHOD # 自动登出方式有server / client

# 控制那些变量输入到浏览器环境， 浏览器代码可以通过 process.env.xxx 读取环境变量
CLIENT_ENV_LIST:
  - API_HOST
  - CLIENT_ID
  - SRM_HOST
  - HELPROBOT_WECHAT_ICON
  - YQCLOUD_BOTPRESS_URL
  - YQCLOUD_PASS_URL
  - YQCLOUD_LOGIN_URL
  - MALLENV_NAME
  - DATA_RANGERS_APP_ID
  - MALL_AUTO_API_HOST
  - WEBSOCKET_HOST
  - AUTO_LOGOUT_METHOD

# PACKAGE_PUBLIC_URL:
  # - http://localhost:8080/dist/srm-front-smdm
